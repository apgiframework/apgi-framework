name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  # Full validation — the same workflow (tests, protocol lock, fixtures,
  # specification checksums, gate table, scans, power reproduction, notebooks)
  # that guards main; the opt-in macOS job is skipped on tags. Nothing is built or published
  # unless every job passes (AUD-CI-01, REL-001).
  validate:
    uses: ./.github/workflows/test.yml

  # -----------------------------------------------------------------------
  # Build a source distribution and wheel
  # -----------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Release manifest with artifact digests (IMP-001, S1-FWK-10)
        run: |
          pip install -e .
          pip install pyyaml
          python scripts/build_release_manifest.py --dist dist --out release-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  # -----------------------------------------------------------------------
  # Publish to PyPI via trusted publishing (OIDC — no API token needed)
  # -----------------------------------------------------------------------
  # The "pypi" environment must be configured with required reviewers (release
  # authority) in repository settings; that approval is the REL-001 promotion
  # record. Certification precedes any archival deposit (REL-005).
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # -----------------------------------------------------------------------
  # Create a GitHub Release with the built artifacts attached
  # -----------------------------------------------------------------------
  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
            TAG="${GITHUB_REF#refs/tags/}"
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]"{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "APGI ${{ steps.tag.outputs.TAG }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
