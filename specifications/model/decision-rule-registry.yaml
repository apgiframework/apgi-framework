- id: DR-P07-SCN-A
  protocol_id: APGI-P07
  kind: scenario
  scenario: A
  rule: Scenario A — Confirmed. p < α and BF₁₀ ≥ 100. Both streams converge on H₁. Counted toward framework-level
    BY-FDR confirmation and toward the joint Bayesian meta-analysis. No additional replication is required
    before the claim is filed.
  rule_sha256: 129fd8f1f00f4411f708fde7386df6c955f3a10e31e6d5260fb776936cac26b9
- id: DR-P07-SCN-B
  protocol_id: APGI-P07
  kind: scenario
  scenario: B
  rule: Scenario B — Tentative confirmation. p < α and 3 ≤ BF₁₀ < 100. The frequentist threshold is met
    but Bayesian evidence is moderate rather than strong; reported as "frequentist-significant, Bayesian
    moderate." One pre-registered independent replication is required before the result is elevated to
    confirmatory status, and that replication is registered before the primary result is published.
  rule_sha256: 47144486d247dec91632f0c1707f9c10fbc0cd8d4575dffdf54722d27691158b
- id: DR-P07-SCN-C
  protocol_id: APGI-P07
  kind: scenario
  scenario: C
  rule: 'Scenario C — Discordant (frequentist-positive, Bayesian-null). p < α and BF₁₀ < 3. The frequentist
    threshold is met but the Bayes factor provides less than moderate evidence for H₁ and may favor H₀.
    Classified as equivocal: the result neither confirms nor falsifies the prediction. It is flagged as
    equivocal in the results and recorded in the analysis log (not in the protocol-deviation register,
    which is reserved for departures from registered procedure). Independent replication at ≥ 90% power
    is required before any interpretation is made.'
  rule_sha256: 5d47898c86d3c2df9dc86063e8383615f0a018f02ced5d30fe1baa73b73c55c0
- id: DR-P07-SCN-D
  protocol_id: APGI-P07
  kind: scenario
  scenario: D
  rule: Scenario D — Bayesian positive (without frequentist significance). p ≥ α and BF₁₀ ≥ 100. Strong
    probabilistic support for H₁ while the NHST threshold is missed. Not counted toward BY-FDR (which
    operates on the frequentist p-values). The original study plus one pre-registered replication are
    required for elevation to confirmatory status.
  rule_sha256: e484424ab58a0bb31ecffab2a8caf787e8ea318a95fd22d99f1c9a845f1df091
- id: DR-P07-SCN-E
  protocol_id: APGI-P07
  kind: scenario
  scenario: E
  rule: Scenario E — Bayesian falsification. p ≥ α and BF₀₁ ≥ 6. The frequentist result is nonsignificant
    and the Bayesian analysis supports H₀. Classified as provisional falsification of the specific sub-prediction
    and reported as such in the primary manuscript. A single Scenario E result triggers independent replication
    at ≥ 90% power before the sub-prediction is declared definitively falsified, and triggers review of
    whether the framework-level falsification threshold has been reached (two or more Scenario E results
    across primary protocols; framework-level decision rule).
  rule_sha256: 63de73f6a5dd3a77e0808ba56ef2b6c7b01cfb1ef3870c7fc5f9409f73e2eadd
- id: DR-P07-SCN-F
  protocol_id: APGI-P07
  kind: scenario
  scenario: F
  rule: 'Scenario F — Indeterminate. p ≥ α and 1/6 < BF₁₀ < 100 (i.e., neither BF₁₀ ≥ 100 nor BF₀₁ ≥ 6).
    Neither stream reaches a decision threshold. Classified as inconclusive: it carries no confirmatory
    or falsifying weight and is reported transparently as indeterminate. It may motivate a pre-registered
    replication but does not by itself trigger one, and it is never counted toward BY-FDR confirmation
    or framework-level falsification.'
  rule_sha256: 18a52cba07ea8acb9c6bbbfd21b783b109a594f155363cbf2a7305041194b4e5
