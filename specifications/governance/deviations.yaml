    compensating_controls: "apgi.core.ignition_decision_strict implements the strict rule; fixtures/ignition-boundary.json tests it; test_bit_identical_boundary_conflict_is_tracked pins the legacy behaviour so it cannot change silently."
    remediation: "Scientific authority confirms the governing rule (AUD-SPEC-CONFIRM-13); then switch the deterministic path or label it an incompatible formulation; bump model MAJOR version."
