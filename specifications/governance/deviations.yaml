# Defects and time-bounded deviations (APGI-VAL-SPEC-1.2 §10; AUD-GOV-06).
# A deviation is accepted only when it states requirement, impact,
# compensating controls, owner, expiry, remediation and approving authority.
# No entry below is approved: approver reads "Not appointed" and every entry
# remains OPEN. Non-waivable requirements (§10) cannot be closed by deviation.
# CI (tests/test_governance.py) rejects entries that are expired or missing
# mandatory fields.
