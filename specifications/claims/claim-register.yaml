- id: CLM-0176
  statement: 'Randomized body-focus attention is predicted to change the effective interoceptive gain
    and thereby shift reportable content weighting; β_SM is a model coefficient rather than a directly
    randomized trait: body-focus attentional manipulation shifts subjective self-report toward bodily/visceral
    dimensions (Tier 3 access proxy; claims about phenomenal experience are excluded by scope). Population
    scope: EMCS participants with confirmed behavioral command-following and MCS+ patients with reproducible
    command-following, intelligible verbalization or intentional communication on the CRS-R who pass the
    preregistered binary-response reliability check (a 40-trial yes/no command-following task, 20 yes
    and 20 no, with ≥ 30 correct responses, 75%, one-sided binomial p = 0.001, in each of two sessions
    ≥ 24 h apart); VS/UWS participants are excluded from this prediction on ethical and methodological
    grounds. The self-report instrument must be pre-specified and OSF-locked: a binary-response adaptation
    of selected PhCI items (Phenomenology of Consciousness Inventory; Pekala, 1991); MAIA (Mehling et
    al., 2012) is a trait questionnaire and serves only as a baseline covariate'
  source: protocols/protocol_7_doc_biomarker.json Pred 7.F; APGI Paper 3
  epistemic_tier: computational
  status: speculative
  status_basis: registered exploratory prediction; no empirical result in this repository
  protocol_id: APGI-P07
  prediction_id: PRED-P07-7F
