   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="33.9264" y="99.895238" transform="rotate(-0 33.9264 99.895238)">Freeze the model</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 127.694438)">Use relative effective precision and excess-surprise</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 141.171781)">accumulation; enforce all gain constraints.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="421.6896" y="99.895238" transform="rotate(-0 421.6896 99.895238)">Controlled perturbations</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(421.6896 127.694438)">Vary parameters over specified ranges; track both sign</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(421.6896 141.171781)">and magnitude of changes.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="33.9264" y="254.335238" transform="rotate(-0 33.9264 254.335238)">Independent realizations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 282.134438)">Archive seeds, per-run outcomes and pass criteria;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 295.611781)">distinguish robustness from empirical validation.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="421.6896" y="254.335238" transform="rotate(-0 421.6896 254.335238)">Unverified legacy values</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(421.6896 282.134438)">The supplied code hard-codes ±50% effects and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(421.6896 295.611781)">10,000-run percentages. No raw sweep is included.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20262e" x="26.64" y="22.9575" transform="rotate(-0 26.64 22.9575)">Sensitivity and robustness: verification requirements</text>
  </g>
  <g id="text_10">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="425.978906" transform="rotate(-0 10.8 425.978906)">APGI 1.1  /  P1S2  /  Analysis-design replacement</text>
  </g>
  <g id="text_11">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="441.818906" transform="rotate(-0 10.8 441.818906)">Quantitative panels pending verified recovery/sweep outputs from the canonical 1.1 implementation.</text>
  </g>
