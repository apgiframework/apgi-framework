   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54 394.234187)">Primary 7.G: baseline HEP → 3-month CRS-R; positive effect and LRT p&lt;.048.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54 405.432)">*PCI-eligible subset. Joint HEP+PCI (7.A) is estimation-first; 7.D prognosis emphasizes 6 months.</text>
  </g>
  <g id="text_41">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="448.334906" transform="rotate(-0 10.8 448.334906)">APGI 1.1  /  PRF8  /  Prospective protocol schematic</text>
  </g>
  <g id="text_42">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="465.038906" transform="rotate(-0 10.8 465.038906)">Protocol 7, specification 1.1.0. No observed outcomes. ≥300 clean heartbeats; absolute mean Cz HEP, 250–400 ms. No synthetic clinical separation is shown.</text>
  </g>
 </g>
