   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="463.238906" transform="rotate(-0 10.8 463.238906)">APGI 1.1  /  P2S1  /  Prospective design schematic</text>
  </g>
  <g id="text_7">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="480.518906" transform="rotate(-0 10.8 480.518906)">Protocol JSON overrides the older manuscript/bundle 60 ms target and 250 ms response schematic.</text>
  </g>
