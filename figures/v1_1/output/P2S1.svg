   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="33.9264" y="107.304037" transform="rotate(-0 33.9264 107.304037)">Protocol 5 / non-invasive intervention</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 138.390281)">Right aINS: tFUS / dTMS + matched sham</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 153.215359)">dlPFC / PPC: TMS reference comparisons</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 168.040438)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 182.865516)">Target engagement gates aINS inference.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 197.690594)">Separate resting PCI probes.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 212.515672)">95% HDI + BF evidence for HEP equivalence.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 227.34075)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 242.165828)">No universal vertex-sham assumption.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #009e73" x="429.2928" y="107.304037" transform="rotate(-0 429.2928 107.304037)">Protocol 6 / implanted electrodes</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 138.390281)">500 ms fixation → 33 ms Gabor → 1 s delay</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 153.215359)">600 trials on an absolute contrast grid</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 168.040438)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 182.865516)">Clinically indicated electrodes only.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 197.690594)">Fixed-contrast bimodality; regional controls.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 212.515672)">AC1 estimation requires validation.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 227.34075)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 242.165828)">Coverage-specific sample sizes reported.</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20262e" x="26.64" y="22.9575" transform="rotate(-0 26.64 22.9575)">Stimulation and intracranial recording test distinct predictions</text>
  </g>
