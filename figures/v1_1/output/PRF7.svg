  </g>
  <g id="text_34">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636f" x="10.8" y="403.118906" transform="rotate(-0 10.8 403.118906)">Protocol 6, specification 1.1.0. No observed outcomes. Target N=20 / minimum 12; confirmatory–exploratory. 500 ms fixation → 33 ms target → 1 s delay.</text>
