   </g>
   <g id="text_27">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 116.998594)">6.A: dip + mixture evidence, not pooled contrasts</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 129.128203)">6.B: direct regional comparison + control model</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="503.371915" y="158.558437" transform="rotate(-0 503.371915 158.558437)">AC1 validation hold</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 182.278594)">6.C deferred pending estimator recovery/power</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 194.408203)">Five samples per 50 ms window at 100 Hz</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="503.371915" y="223.838437" transform="rotate(-0 503.371915 223.838437)">Coverage-specific timescales</text>
   </g>
   <g id="text_31">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 247.558594)">6.E: ≥3 dissociable scales + surrogate controls</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(503.371915 259.688203)">aINS subset; independent replication needed</text>
   </g>
