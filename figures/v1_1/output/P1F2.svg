   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 349.915238)">Proposed gain pathway; the physiological circuit does not by itself validate APGI.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(33.9264 363.392581)">A causal circuit dissociation is required. Effective gains are clamped and causally normalized.</text>
