   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="33.9264" y="107.304037" transform="rotate(-0 33.9264 107.304037)">Fast: ACC → locus coeruleus</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 138.390281)">Level-3 cortical signal → brainstem relay</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 153.215359)">Phasic NE modulates Level-1 threshold</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 168.040438)">Tonic NE can alter Level-0 gain</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(33.9264 182.865516)">LC is a relay, not a hierarchical stratum</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="429.2928" y="107.304037" transform="rotate(-0 429.2928 107.304037)">Slow: PVN → HPA axis</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 138.390281)">CRH → ACTH → cortisol</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 153.215359)">Rapid membrane-MR facilitation</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 168.040438)">Sustained GR suppression</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(429.2928 182.865516)">Neuroendocrine priors modulate cortex</text>
   </g>
